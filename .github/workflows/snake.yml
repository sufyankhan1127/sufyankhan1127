name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322d3ee&color_dots=%230f172a,%231e293b,%23334155,%2306b6d4,%238b5cf6&color_empty=%230d1117&size=10
            dist/github-contribution-grid-snake-dark.svg?color_snake=%238b5cf6&color_dots=%23111827,%231e1b4b,%23312e81,%237c3aed,%2322d3ee&color_empty=%230d1117&size=10

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
